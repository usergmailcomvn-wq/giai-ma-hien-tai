<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giải mã hiền tài là nguyên khí quốc gia</title><style>html,body{margin:0;min-height:100%;background:#071a18;color:#f1e9d6;font:16px system-ui}#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}</style></head><body><div id="loading">Đang tải trò chơi…</div><script>
(async()=>{
 try{
  const count=19;
  const files=Array.from({length:count},(_,i)=>`payload/part-${String(i).padStart(2,'0')}.txt`);
  const pieces=await Promise.all(files.map(async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('Không tải được '+url);return r.text()}));
  const html=pieces.join('');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('loading').textContent='Không thể tải trò chơi. Hãy tải lại trang hoặc kiểm tra kết nối mạng.';console.error(e)}
})();
</script></body></html>
